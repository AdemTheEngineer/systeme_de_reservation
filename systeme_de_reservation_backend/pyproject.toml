[project]
name = "systeme-de-reservation-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "croniter>=6.2.3",
    "django>=6.0.6",
    "django-cors-headers>=4.9.0",
    "django-debug-toolbar>=7.0.0",
    "django-environ>=0.14.0",
    "django-extensions>=4.1",
    "django-filter>=25.2",
    "django-import-export>=4.4.1",
    "django-jazzmin>=3.0.5",
    "django-redis>=7.0.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular[sidecar]>=0.30.0",
    "drf-yasg>=1.21.15",
    "ipython>=9.15.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "python-dateutil>=2.9.0.post0",
    "python-decouple>=3.8",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "--reuse-db"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "manage.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
